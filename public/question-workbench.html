<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小马谷 · 全部题目工作台</title>
<style>body{font:15px/1.8 system-ui;background:#f8f5ec;color:#39334a;margin:0;padding:24px}main{max-width:900px;margin:auto}h1{font-size:24px}header{position:sticky;top:0;background:#f8f5ec;padding:12px 0}select,input{padding:9px;border:1px solid #ddd;border-radius:9px}article{background:#fffdf9;padding:22px;border:1px solid #e7e1d6;border-radius:18px;margin:16px 0}small{color:#887693}h2{font-size:18px}li{padding:8px 0}code{color:#8b5689}p{color:#746b7d}</style>
<main><header><h1>全部题目工作台</h1><p>当前研究修订题库 · 48题 · 四维各12题 · 每题两个不同的行为选项。显示用户实际看到的选项顺序及计分。</p><p><a href="/research-notes.html">研究与计分说明</a> · <a href="/character-evidence-workbench.html">40份角色剧情证据</a> · 尚未实测验证</p><select id="axis"><option value="">全部维度</option><option>EI</option><option>SN</option><option>TF</option><option>JP</option></select> <input id="search" placeholder="搜索题目或选项"><span id="count"></span></header><div id="list"></div></main>
<script src="/mbti-questions.js?v=20261012-research-audit"></script><script src="/quiz-world.js?v=20261012-research-audit"></script><script>
const labels={EI:'友谊能量 · E 外向 / I 内向',SN:'线索探索 · S 实感 / N 直觉',TF:'友谊抉择 · T 思考 / F 情感',JP:'冒险节奏 · J 判断 / P 知觉'};
function render(){const list=document.getElementById('list');list.replaceChildren();let n=0;window.QUIZ_QUESTIONS.forEach((q,i)=>{if(document.getElementById('axis').value&&q[2].axis!==document.getElementById('axis').value)return;if(!JSON.stringify(q).includes(document.getElementById('search').value))return;n++;const a=document.createElement('article'),s=document.createElement('small'),h=document.createElement('h2'),ol=document.createElement('ol');s.textContent=`Q${i+1} · ${labels[q[2].axis]}`;h.textContent=q[0];q[1].forEach(([text,value],j)=>{const li=document.createElement('li');li.textContent=`${'ABCD'[j]} · ${text}　〔${value>0?q[2].axis[0]:q[2].axis[1]}侧，权重 ${Math.abs(value)===1?'1':'1/3'}〕`;ol.append(li)});const note=document.createElement("p");note.textContent="内容侧面："+q[2].facet+"。审查提醒："+q[2].review;a.append(s,h,ol,note);list.append(a)});document.getElementById('count').textContent=`　显示 ${n} 题`;}document.getElementById('axis').onchange=render;document.getElementById('search').oninput=render;render();
</script></html>
