<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色证据工作台</title><style>body{font:16px/1.8 system-ui;background:#faf7ef;color:#43394f;max-width:900px;margin:auto;padding:24px}article{background:#fff;padding:24px;border-radius:20px;margin:20px 0}a{color:#765591}input{padding:12px;border:1px solid #ddd;border-radius:12px}small{color:#87758e}</style><h1>40份角色剧情证据</h1><p>事实与编辑解释分开；未逐集独立复核，未完成多人编码。资料入口为社区转录，并非官方MBTI。</p><a href="/question-workbench.html">题目工作台</a> · <a href="/research-notes.html">研究说明</a><p><input id="search" placeholder="搜索英文角色名或剧情"><span id="count"></span></p><main id="list"></main><script src="/character-evidence.js"></script><script>function render(){const host=document.getElementById('list');host.replaceChildren();let n=0;const el=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};Object.entries(window.CHARACTER_EVIDENCE).forEach(([slug,r])=>{if(!(slug+JSON.stringify(r)).toLowerCase().includes(document.getElementById('search').value.toLowerCase()))return;n++;const a=el('article','');a.append(el('h2',slug),el('small',r.status+(r.limited?' · 日常证据有限':'')));r.facts.forEach(f=>{a.append(el('p','剧情事实：'+f.text));const link=el('a',f.source.title);link.href=f.source.url;link.target='_blank';link.rel='noopener noreferrer';a.append(link)});a.append(el('h3','编辑解释'),el('p',r.interpretation),el('h3','推断边界'),el('p',r.limits));host.append(a)});document.getElementById('count').textContent=' 显示 '+n+' 份'}document.getElementById('search').oninput=render;render();</script></html>
